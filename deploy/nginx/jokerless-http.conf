# jokerless.com and jokerless.org, plain HTTP — the ACME challenge and the
# redirect to TLS, and nothing else.
#
# A separate file from jokerless.conf because it has to exist first. The
# certificate is issued over this vhost (HTTP-01, webroot shared with the
# limidus renewal), and the TLS vhost cannot pass `nginx -t` until that
# certificate is on disk. scripts/deploy.sh installs this one, asks certbot
# for the certificate if there is none, and only then installs the other.
#
# www redirects straight to the https apex, so a visitor does not bounce
# through https://www first.
#
# DNS for all four names is DNS-only (grey cloud) in Cloudflare, pointing at
# the WAN address. A proxied record would answer the challenge from
# Cloudflare's edge and take over TLS, and this file assumes neither.

# Managed by zolik deploy.
server {
    listen 80;
    listen 192.168.13.13:80;
    server_name jokerless.com www.jokerless.com jokerless.org www.jokerless.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        if ($host = www.jokerless.com) { return 301 https://jokerless.com$request_uri; }
        if ($host = www.jokerless.org) { return 301 https://jokerless.org$request_uri; }
        return 301 https://$host$request_uri;
    }
}
