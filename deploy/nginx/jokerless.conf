# jokerless.com and jokerless.org over TLS.
#
# jokerless.com is the canonical name (PUBLIC_BASE_URL: the OAuth callback and
# the invite links the server hands out). jokerless.org serves the same game
# from the same upstream rather than redirecting, for now — the web client
# talks to whichever origin served it, so either works on its own. Sign-in is
# per origin (the session lives in the browser's storage for that domain), so
# a player signed in on .com is a stranger on .org until they sign in there.
#
# Only installed once /etc/letsencrypt/live/jokerless exists; see
# jokerless-http.conf for why the two are separate files.

# Managed by zolik deploy.
server {
    listen 443 ssl;
    listen 192.168.13.13:443 ssl;
    http2 on;
    server_name www.jokerless.com www.jokerless.org;

    ssl_certificate     /etc/letsencrypt/live/jokerless/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jokerless/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.jokerless.org) { return 301 https://jokerless.org$request_uri; }
    return 301 https://jokerless.com$request_uri;
}

server {
    listen 443 ssl;
    listen 192.168.13.13:443 ssl;
    http2 on;
    server_name jokerless.com jokerless.org;

    ssl_certificate     /etc/letsencrypt/live/jokerless/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jokerless/privkey.pem;

    include /etc/nginx/snippets/zolik-proxy.conf;
}
