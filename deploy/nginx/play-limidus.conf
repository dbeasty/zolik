# play.limidus.com — Expo web SPA + zolik API on one origin.
# Installed by scripts/deploy.sh; replaces the static placeholder vhost.
#
# WAN NAT lands on 192.168.13.13:{80,443}, so both the wildcard and the
# service IP must be declared — a vhost that says only `listen 443` is
# unreachable from the internet on this host.

# Managed by zolik deploy — ACME webroot shared with limidus.com renewal.
server {
    listen 80;
    listen 192.168.13.13:80;
    server_name play.limidus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 192.168.13.13:443 ssl;
    http2 on;
    server_name play.limidus.com;

    ssl_certificate     /etc/letsencrypt/live/limidus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limidus/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # WebSocket — matches and lobby.
    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # REST API — every top-level route the Go server registers.
    #
    # Kept in step by TestPublicVhostReachesEveryRoute (server/internal/app),
    # which enumerates the router for real and fails if a prefix listed here
    # has drifted from one. A route missing from this list does not 404: it
    # falls through to the SPA below and returns index.html, so the client
    # gets HTML where it expected JSON and the failure surfaces as a parse
    # error somewhere else entirely. `lobby` was missing exactly that way.
    location ~ ^/(auth|lobby|modules|matches|leaderboard|stats|users|scoring-sessions|healthz|version)(/|$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Expo static export — client-side routes fall back to index.html.
    root /home/zolik/web/current;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
