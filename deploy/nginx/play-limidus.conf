# play.limidus.com — TLS termination and nothing else.
# Installed by scripts/deploy.sh; replaces the static placeholder vhost.
#
# There is no route list here any more, and no static root. The zolik
# container serves both the API and the web client (the Expo export is
# compiled into the server binary — see server/internal/webui), so this file's
# whole job is TLS, the ACME challenge, and handing everything else to
# 127.0.0.1:8090.
#
# That deletes a class of bug rather than fixing an instance of one. This vhost
# used to enumerate every top-level path the Go server registers, and a path
# missing from that list did not 404 — it fell through to the SPA and returned
# index.html, so a client asking for JSON got HTML and the failure surfaced as
# a parse error somewhere else entirely. `lobby` was missing exactly that way,
# and a Go test existed solely to keep the list in step. With one upstream
# there is no list to drift.
#
# WAN NAT lands on 192.168.13.13:{80,443}, so both the wildcard and the
# service IP must be declared — a vhost that says only `listen 443` is
# unreachable from the internet on this host.

# Managed by zolik deploy — ACME webroot shared with limidus.com renewal.
server {
    listen 80;
    listen 192.168.13.13:80;
    server_name play.limidus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 192.168.13.13:443 ssl;
    http2 on;
    server_name play.limidus.com;

    ssl_certificate     /etc/letsencrypt/live/limidus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limidus/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The JavaScript bundle is a couple of megabytes and the server already
    # sets its own cache headers; nothing here needs to buffer it to disk or
    # second-guess them.
    client_max_body_size 8m;

    # WebSocket — matches and lobby. Separate from the block below only
    # because an upgrade needs the connection headers and the read timeout,
    # and must not be buffered.
    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # There is deliberately no /admin block here, and adding one would be a
    # mistake in either direction.
    #
    # The operator console is not served by this upstream at all. It lives on a
    # second listener inside the container (ADMIN_PORT, mapped to the host's
    # 127.0.0.1:8091 and nowhere else), and the game's own router does not
    # register its routes — so `location /` below cannot reach it, and
    # /admin here 404s like any other unknown path.
    #
    # A `location /admin { deny all; }` would be worse than nothing: it reads
    # as the thing keeping the console private, when what actually keeps it
    # private is that this vhost has no route to that port. It would also be a
    # negative rule on a positive-by-default catch-all, needing to be exactly
    # as clever as every path that normalises to the same handler — /admin,
    # /Admin, //admin, /./admin.
    #
    # If browser access without an SSH tunnel is ever wanted, it belongs in a
    # separate admin.play.limidus.com vhost with `ssl_verify_client on` against
    # a private CA, proxying to 127.0.0.1:8091 — never as a location in here.

    # Everything else: the REST API and the web client, from the one upstream
    # that knows which is which. The server gives the API priority and falls
    # back to the client, so a path added to the router tomorrow needs no
    # change here.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
