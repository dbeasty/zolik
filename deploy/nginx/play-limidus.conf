# play.limidus.com — TLS termination and nothing else.
# The locations live in zolik-proxy.conf, shared with jokerless.conf.
# Installed by scripts/deploy.sh; replaces the static placeholder vhost.
#
# There is no route list here any more, and no static root. The zolik
# container serves both the API and the web client (the Expo export is
# compiled into the server binary — see server/internal/webui), so this file's
# whole job is TLS, the ACME challenge, and handing everything else to
# 127.0.0.1:8090.
#
# That deletes a class of bug rather than fixing an instance of one. This vhost
# used to enumerate every top-level path the Go server registers, and a path
# missing from that list did not 404 — it fell through to the SPA and returned
# index.html, so a client asking for JSON got HTML and the failure surfaced as
# a parse error somewhere else entirely. `lobby` was missing exactly that way,
# and a Go test existed solely to keep the list in step. With one upstream
# there is no list to drift.
#
# WAN NAT lands on 192.168.13.13:{80,443}, so both the wildcard and the
# service IP must be declared — a vhost that says only `listen 443` is
# unreachable from the internet on this host.

# Managed by zolik deploy — ACME webroot shared with limidus.com renewal.
server {
    listen 80;
    listen 192.168.13.13:80;
    server_name play.limidus.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 192.168.13.13:443 ssl;
    http2 on;
    server_name play.limidus.com;

    ssl_certificate     /etc/letsencrypt/live/limidus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limidus/privkey.pem;

    include /etc/nginx/snippets/zolik-proxy.conf;
}
