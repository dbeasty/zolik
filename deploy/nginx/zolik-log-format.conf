# The access-log format every zolik vhost writes. Installed by
# scripts/deploy.sh to /etc/nginx/conf.d/zolik-log-format.conf, which the
# stock nginx.conf includes inside its http block - the only place a
# log_format may be declared. zolik-proxy.conf points its access_log at it.
#
# It is nginx's "combined" format with the query string left out. The
# WebSocket routes carry the player's access token as ?token=, because a
# browser cannot set a header on a socket it opens, and "combined" logs
# $request, the whole request line: every connection would have written a
# live bearer token to /var/log/nginx/access.log. $uri is the path alone.
log_format zolik_noquery '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
