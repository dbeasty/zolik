[project]
name = "zolik-ml"
version = "0.1.0"
description = "Trainer for zolik's learned bots: PPO over the Go game environment (server/cmd/gameenv)."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "tensorboard>=2.16",
    "pyyaml>=6.0",
    "orjson>=3.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zolik_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
