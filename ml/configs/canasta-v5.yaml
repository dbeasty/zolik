# Canasta v5: canasta-v4 fine-tuned (--init, same 539/44 encoder) to be
# caught holding cards less when the other side closes early. v4 went out on
# 14.6% of deals at four seats against the closer and was caught on 81.9%,
# holding 5.5 cards / 92 points, and lost 291 a deal on the deals the closer
# ended by its own turn 10.
#
# League: four seats 0.85, and the closer and the racing Hard weighted up;
# plus reward.goout, a small bonus for going out and a capped penalty for the
# points held when the other side does.
#
#   uv run python train.py --game canasta --config configs/canasta-v5.yaml \
#     --run canasta-v5 --minutes 120 --init <canasta-v4 final.bin> \
#     --set env.envs=12
#
# A/B smoke (12 minutes an arm from v4, 150 held-out seeds, four seats): this
# league alone +2,406 ± 101 vs closer, caught 83.0%; with the shaping +2,558
# ± 95, caught 80.9%; plain v4 config +2,285 ± 94, caught 84.6% (v4 itself
# +2,684 ± 92, 81.9%). All within noise of each other; the shaping arm was
# best on both and was the one trained.
#
# Result (2026-10-04, 556 updates, 9.1M decisions at ~1,360/s; 300 held-out
# seeds, temperature 0): vs closer at four seats +2,580 ± 71 (v4 +2,474), with
# a Hard partner +1,746 ± 70 (v4 +1,601), vs Hard +2,196 ± 73 (v4 +2,257),
# head to head with v4 +241 ± 111 (4 seats) and -124 ± 193 (2). Against the
# closer it goes out on 20.9% of deals (v4 14.6%) and is caught on 76.9%
# (81.9%) holding 5.1 cards / 81 points (5.5 / 92); on the deals the closer
# ends by its turn 10 (42%, v4 47%) it still nets -340 (v4 -291).
game: canasta
variation: classic

model:
  trunk: [256, 256]
  scorer: [128]
  value: [128]
  priv: [128]

reward:
  match:
    alpha: 0.5
    k: 5.0  # winmodel.py: sd(deal reward) 1.12 / sd(ΔP) 0.216 = 5.16
    model: configs/canasta-winmodel.json
  # Go-out shaping (learn.GoOutShaping), added after the match mix: +0.1 to
  # the side that went out, and min(0.3, points held / 1000) off a side
  # caught. It counts against a deal term weighted alpha = 0.5, so going out
  # is paid like 200 more points and every point held is counted three times.
  goout: {out: 0.1, held: 1.0, cap: 0.3}

env:
  envs: 8
  tables: 32
  procs: 1
  gogc: 1000
  budget: 50000

ppo:
  lr: 4.0e-4
  gamma: 0.999
  lam: 0.95
  clip: 0.2
  vf_coef: 0.5
  ent_coef: 0.012
  max_grad_norm: 0.5
  epochs: 4
  minibatch: 2048
  target_kl: 0.03
  reward_scale: 1.0

train:
  rollout: 16384
  total_updates: 5000
  snapshot_every: 20
  reset_every: 20
  lr_floor: 0.25

league:
  blend: {checkpoint: 0.25, heuristic: 0.55, self: 0.2}
  seats: {4: 0.85, 2: 0.15}
  samba: false
  variations:
    samba: {2: 0.3, 4: 0.4, 6: 0.3}
  partnerships: true
  partner_learner: 0.5
  partner_bot: hard
  opponents:
    closer: 2.0
    hard: 1.5
    medium: 0.4
    easy: 0.1
  checkpoint_temperature: 1.0
  checkpoint_decay: 0.8
  pool_size: 20

eval:
  seats: 4
  seeds: 300
  opponents: [closer, hard, medium]
