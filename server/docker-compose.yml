# app and app2 are one image on two ports. Shared so a version build-arg can
# never reach one and not the other — see scripts/version.sh for how
# ZOLIK_VERSION/ZOLIK_COMMIT get set.
x-server-build: &server-build
  context: ..
  dockerfile: server/Dockerfile
  args:
    # The quotes matter: an exported-but-empty ZOLIK_VERSION must still fall
    # back to the Dockerfile's ARG default, not override it with "".
    ZOLIK_VERSION: "${ZOLIK_VERSION:-0.0.0-dev}"
    ZOLIK_COMMIT: "${ZOLIK_COMMIT:-unknown}"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Host-side only (Compass/mongosh). Services reach mongo at mongo:27017 on the
      # compose network, so this can be anything free; 27018 dodges a local mongo on 27017.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    # Without this, `depends_on: [mongo]` below only waits for the *container*
    # to start, not for mongod to actually accept connections — on a cold
    # `docker compose up --build` (fresh volume, image just built) app can
    # win that race and fail its one startup connection attempt with
    # "context deadline exceeded" before mongod is ready. `restart:
    # unless-stopped` masks it by quietly recovering a few seconds later, but
    # it logs like a real failure in the meantime. `condition:
    # service_healthy` below makes Compose actually wait.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 2s
      timeout: 3s
      retries: 20

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: dev
      ME_CONFIG_BASICAUTH_PASSWORD: dev
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: *server-build
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8090"
      SSH_ENABLED: "true"
      SSH_PORT: "2222"
      SSH_HOST_KEY_PATH: /tmp/zolik-ssh/zolik_host_key
      SSH_ALLOW_ALL_KEYS: "true"
    ports:
      - "8090:8090"
      - "2222:2222"

  app2:
    build: *server-build
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8092"
      # Only `app` hosts the SSH TUI (it publishes 2222). Without this, APP_ENV=local
      # defaults SSH_ENABLED=true and SSHHostKeyPath to the relative ".ssh/zolik_host_key",
      # which this distroless nonroot image cannot create at WORKDIR / -> log.Fatalf -> restart loop.
      SSH_ENABLED: "false"
    ports:
      - "8092:8092"

volumes:
  mongo_data:

