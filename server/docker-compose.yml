services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Host-side only (Compass/mongosh). Services reach mongo at mongo:27017 on the
      # compose network, so this can be anything free; 27018 dodges a local mongo on 27017.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: dev
      ME_CONFIG_BASICAUTH_PASSWORD: dev
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8090"
      SSH_ENABLED: "true"
      SSH_PORT: "2222"
      SSH_HOST_KEY_PATH: /tmp/zolik-ssh/zolik_host_key
      SSH_ALLOW_ALL_KEYS: "true"
    ports:
      - "8090:8090"
      - "2222:2222"

  app2:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8092"
      # Only `app` hosts the SSH TUI (it publishes 2222). Without this, APP_ENV=local
      # defaults SSH_ENABLED=true and SSHHostKeyPath to the relative ".ssh/zolik_host_key",
      # which this distroless nonroot image cannot create at WORKDIR / -> log.Fatalf -> restart loop.
      SSH_ENABLED: "false"
    ports:
      - "8092:8092"

volumes:
  mongo_data:

