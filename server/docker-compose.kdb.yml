# The KDB development stack: ONE container, nothing else.
#
# This file builds from source. The stack that actually runs on the public
# host is deploy/compose/zolik.yml, which builds nothing and runs an image
# shipped to it — same container shape, and a test keeps the two in step
# (server/internal/app/deploy_test.go).
#
# FEATURE_FLAG_DB_ENGINE=kdb runs the storage engine embedded inside the
# server process — no MongoDB, no mongo-express, no Redis — which is the
# whole memory-footprint story: the fixed cost of the stack is one Go binary
# plus its data directory. The websocket hub and the lobby waiting room fall
# back to their in-process implementations when REDIS_URL is unset, which is
# the supported single-instance mode.
#
#   docker compose -f docker-compose.kdb.yml up --build
#
# The build needs the kdb sibling checkout (../../kdb from this file) — same
# additional_contexts wiring as docker-compose.yml. To move an existing
# deployment back to Mongo, deploy docker-compose.yml instead: the image is
# identical, only the flag differs.
services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
      additional_contexts:
        kdbsrc: ../../kdb
      args:
        ZOLIK_VERSION: "${ZOLIK_VERSION:-0.0.0-dev}"
        ZOLIK_COMMIT: "${ZOLIK_COMMIT:-unknown}"
        # The web client is compiled into the server binary now, so this image
        # builds it too — see server/Dockerfile and internal/webui. This is the
        # address the *browser* will use to reach the API, baked into the
        # bundle at export time and not changeable at run time.
        # scripts/dev-stack.sh serves the client from Expo's own dev server on
        # another port and does not depend on this; it matters only when the
        # container's own port is opened directly.
        ZOLIK_PUBLIC_URL: "${ZOLIK_DEV_API_URL:-http://127.0.0.1:8090}"
    restart: unless-stopped
    # Sized for a 1–2 GB host: one Go binary + embedded KDB, no Mongo/Redis.
    #
    # Read this together with the fractions the process derives from it, which
    # are all fractions *of this number* and therefore all move when it does:
    # KDB's hot-tier cache pool is half of it, KDB sheds writes at 0.85 of it,
    # the admission gate refuses players at 0.85 of it, and GOMEMLIMIT sits
    # just below that gate so the collector reacts before anybody is turned
    # away (internal/app/app.go, goMemLimitFor). Raising this raises the cache
    # pool by the same proportion, so it buys less headroom than it looks like
    # it does.
    #
    # What it does not scale is the rescue reserve, which is a fixed
    # allocation per storage namespace and was the reason this container used
    # to idle at 81% of 1 GiB — see kdbRescueReserveBytes in
    # server/internal/db/kdb.go.
    mem_limit: 2g
    env_file:
      - .env
    # These override .env, so the container's shape is stated here rather than
    # depending on what a particular host's .env happens to hold.
    environment:
      FEATURE_FLAG_DB_ENGINE: kdb
      KDB_PATH: /data/kdb
      # KDB 0.4.0's history retention modes, behind a flag and off by default.
      #
      #   none  keep the current dataset plus a 24h window (KDB_RETAIN_DURATION
      #         moves it); everything older is reclaimed, so the footprint is a
      #         function of the data rather than of how many commits have ever
      #         been made. Costs write throughput — measured on this stack, the
      #         reclaim lands in the write path and the gameplay
      #         load→apply→store cycle roughly triples.
      #   full  keep every commit forever. What KDB did before the modes
      #         existed, and what every namespace built before this line is.
      #
      # The flag is on and the mode is unset, which together mean "nothing
      # changes": unset reads as whatever a namespace already is, and for a
      # new one, full. The flag decides whether a mode is listened to, not
      # which mode it is — it exists to be turned off, and it is transitional
      # either way. A later KDB switches the mode on a running namespace and
      # it comes out.
      #
      # To try `none` here — the wipe is not optional, an existing volume
      # holds full-mode namespaces and they REFUSE TO OPEN under any other,
      # which is a container that exits and restarts forever:
      #
      #   ZOLIK_KDB_HISTORY_MODE=none ZOLIK_DEV_DATA=clean scripts/dev-stack.sh up
      #
      # dev-stack.sh recognises that mismatch crash if you forget the wipe.
      # Production is a different matter; see deploy/compose/zolik.yml and
      # docs/kdb-history-none-cutover.md.
      FEATURE_FLAG_KDB_HISTORY_RETENTION: "${ZOLIK_KDB_HISTORY_RETENTION:-true}"
      KDB_HISTORY_MODE: "${ZOLIK_KDB_HISTORY_MODE:-}"
      PORT: "8090"
      # Off, and said out loud. Removing the SSH_* variables does not turn the
      # terminal client off — SSH_ENABLED defaults *on* whenever APP_ENV is
      # local, and its default host key path is one the image's nonroot user
      # cannot create. Left unstated, that combination crash-looped the
      # container: mkdir .ssh: permission denied, exit, restart, repeat.
      SSH_ENABLED: "false"
      # Belt and braces for the same reason: this also defaults on under a
      # local APP_ENV, and "any key is admitted" is not a default a public
      # host should ever be one edited line away from.
      SSH_ALLOW_ALL_KEYS: "false"
      # /matches/{id}/debug-state writes match state straight past the rules,
      # and /auth/dev/last-code hands back the sign-in code mailed to any
      # address. Both default ON under a local APP_ENV — which the production
      # env file deliberately sets, to keep guest play working without SMTP —
      # so they are closed here explicitly rather than by implication.
      #
      # The end-to-end suite needs them, and opens them deliberately:
      # scripts/dev-stack.sh sets ZOLIK_TEST_ENDPOINTS=true. Nothing else
      # does, so a deployment gets them shut without having to remember to
      # shut them.
      ENABLE_TEST_ENDPOINTS: "${ZOLIK_TEST_ENDPOINTS:-false}"
      # /debug/memory and /debug/pprof: where this process's memory has gone,
      # and a heap profile that names the call sites holding it. Same class of
      # hatch as the two above — on by default under a local APP_ENV, so shut
      # here explicitly — and additionally able to stop the world on request.
      ENABLE_DEBUG_ENDPOINTS: "${ZOLIK_DEBUG_ENDPOINTS:-false}"
      # How long a bot pauses before answering. Empty means the server's own
      # defaults, which are a pace for people to watch. The end-to-end suite
      # sets both to near zero: the pause is cosmetic, and a suite that sleeps
      # through it is a suite whose timeouts measure the sleep rather than the
      # code — see scripts/dev-stack.sh.
      BOT_THINK_MIN_MS: "${ZOLIK_BOT_THINK_MIN_MS:-}"
      BOT_THINK_MAX_MS: "${ZOLIK_BOT_THINK_MAX_MS:-}"
    volumes:
      # /data is created nonroot-owned in the image, so the engine can write
      # under the distroless nonroot user.
      - kdb_data:/data
    # Loopback only — nginx on play.limidus.com is the public entry point.
    # For LAN dev from another machine, override: ZOLIK_BIND=0.0.0.0 docker compose …
    ports:
      - "${ZOLIK_BIND:-127.0.0.1}:8090:8090"

volumes:
  kdb_data:
